name: Filing language themes
# Indexes 10-K/10-Q section text since 2021 for every company (stored copies first, EDGAR for the rest) and
# publishes themes/index.json, themes/{id}.json and themes/co/{T}.json. Code: etl/themes.py, etl/themes_runner.py.
# Needs repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SEC_USER_AGENT.
# SEC allows 10 requests per second in total across all machines and the IR backfill's SEC lane uses most of it, so
# this lane takes about 1 request per second in total (split across shards).
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel runners (max 4)"
        required: false
        default: "2"
      workers:
        description: "Companies at a time per runner"
        required: false
        default: "8"
      hours:
        description: "Hours per runner (max 5.5)"
        required: false
        default: "5"
      sec_rps:
        description: "SEC requests per second for the whole lane"
        required: false
        default: "1"
      tickers:
        description: "Comma-separated tickers (blank = all)"
        required: false
        default: ""
  schedule:
    # Daily: new filings and any theme definition change; then republish.
    - cron: "17 6 * * *"
permissions:
  contents: read
concurrency:
  group: themes-index
  cancel-in-progress: false
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check secrets
        run: |
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SEC_USER_AGENT; do
            if [ -z "${!v}" ]; then echo "Missing repository secret $v"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Index shard
        env:
          SHARDS: ${{ github.event.inputs.shards || '2' }}
          WORKERS: ${{ github.event.inputs.workers || '8' }}
          HOURS: ${{ github.event.inputs.hours || '5' }}
          SEC_RPS: ${{ github.event.inputs.sec_rps || '1' }}
          TICKERS: ${{ github.event.inputs.tickers || '' }}
        run: |
          if [ "${{ matrix.shard }}" -ge "$SHARDS" ]; then echo "shard not used"; exit 0; fi
          export SEC_GAP=$(python -c "print(round(int('$SHARDS') / float('$SEC_RPS'), 3))")
          python -m etl.themes_runner --shard ${{ matrix.shard }} --shards "$SHARDS" --workers "$WORKERS" --hours "$HOURS" --tickers "$TICKERS"
  publish:
    needs: index
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Aggregate and publish
        run: python -m etl.themes_runner --aggregate-only
