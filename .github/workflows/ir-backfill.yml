name: IR document backfill
# Bulk IR documents (Tavily site discovery, Firecrawl map/scrape, SEC exhibits, text extraction) on GitHub runners,
# outside the Vercel cron's 800 s and memory limits. Same code path as the cron: etl/ir_backfill_runner.py.
# Needs repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FIRECRAWL_API_KEY, TAVILY_API_KEY, SEC_USER_AGENT.
# Each shard is a separate runner (its own IP), so SEC's 10 requests per second applies per shard.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel runners"
        required: false
        default: "4"
      workers:
        description: "Companies at a time per runner"
        required: false
        default: "6"
      hours:
        description: "Hours per runner (max 5.7)"
        required: false
        default: "5.5"
      tickers:
        description: "Comma-separated tickers (blank = companies without IR documents, then partial ones)"
        required: false
        default: ""
  schedule:
    # Every six hours while the first pass is still running; remove once coverage is complete.
    - cron: "23 */6 * * *"
permissions:
  contents: read
concurrency:
  group: ir-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - name: Check secrets
        run: |
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY FIRECRAWL_API_KEY TAVILY_API_KEY SEC_USER_AGENT; do
            if [ -z "${!v}" ]; then echo "Missing repository secret $v"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backfill shard
        env:
          SHARDS: ${{ github.event.inputs.shards || '4' }}
          WORKERS: ${{ github.event.inputs.workers || '6' }}
          HOURS: ${{ github.event.inputs.hours || '5.5' }}
          TICKERS: ${{ github.event.inputs.tickers || '' }}
        run: |
          if [ "${{ matrix.shard }}" -ge "$SHARDS" ]; then echo "shard not used"; exit 0; fi
          python -m etl.ir_backfill_runner --shard ${{ matrix.shard }} --shards "$SHARDS" --workers "$WORKERS" --hours "$HOURS" --tickers "$TICKERS"
