name: US Company Logo Archive (2,500)
on:
  push:
    branches:
      - assets/us-company-logos-2500-20261116
    paths:
      - scripts/build_us_logo_archive_2026.py
      - .github/workflows/build-us-logo-archive.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image download/verification libraries
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Fetch, verify and package original company logos
        run: python -u scripts/build_us_logo_archive_2026.py
      - name: Upload verified ZIP assets as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: filed-under-top2500-us-company-logos
          path: |
            company-logo-assets/*.zip
            company-logo-assets/*.csv
            company-logo-assets/SUMMARY.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable ZIP download URLs (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="us-logos-top2500-20261116"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Top 2,500 US Public Companies — Original Logo Assets (2026-11-16)" \
              --notes "Five independently validated 500-company ZIP batches plus a complete combined archive. SVG-first, PNG backup; metadata, provenance, hashes, explicit missing files. No generic letter-tile substitutions." \
              --target "$GITHUB_SHA"
          gh release upload "$TAG" company-logo-assets/*.zip company-logo-assets/master_manifest.csv \
            company-logo-assets/missing_logos.csv company-logo-assets/SUMMARY.json \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "### Verified logo archive released" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
