name: IR official sources
# Stores the files each company lists on its own investor-relations pages (etl/ir_sources/{TICKER}.json, built by
# etl/ir_official.py) with the fiscal period, type and release date the company states, corrects those fields on
# documents already stored, and republishes the document index with the listing and its coverage. Same collector as
# the backfill (etl/ir_backfill_runner.py -> ir.process_company), run for named tickers with a document budget large
# enough to take a whole listing in one pass.
# With "workbooks" on, trend workbooks (etl/ir_sources/workbooks/{TICKER}.xlsx) are then published: every figure is
# tied to a page line of a stored supplement and checked before it replaces the ticker's IR KPI set (the previous
# set is saved to raw/kpi_backups/ first). Run it after the documents are stored; it refuses when fewer than 90% of
# the figures are found on a stored page.
# Needs repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FIRECRAWL_API_KEY, TAVILY_API_KEY, SEC_USER_AGENT.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (blank = every ticker with a source list)"
        required: false
        default: ""
      max_docs:
        description: "Documents per company in this run"
        required: false
        default: "2000"
      hours:
        description: "Hours per pass (two passes; max 2.7)"
        required: false
        default: "2.5"
      extended:
        description: "Also store extended material (regulatory disclosures, offering documents, proxy statements)"
        type: boolean
        required: false
        default: false
      workbooks:
        description: "Publish trend workbooks for these tickers after the documents are stored"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ir-official
  cancel-in-progress: false
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  TICKERS: ${{ github.event.inputs.tickers || '' }}
  MAX_DOCS: ${{ github.event.inputs.max_docs || '2000' }}
  HOURS: ${{ github.event.inputs.hours || '2.5' }}
  FU_IR_EXTENDED: ${{ github.event.inputs.extended == 'true' && '1' || '0' }}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check secrets
        run: |
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SEC_USER_AGENT; do
            if [ -z "${!v}" ]; then echo "Missing repository secret $v"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tickers
        run: |
          if [ -z "$TICKERS" ]; then
            TICKERS=$(python -c "from etl import ir_official; print(','.join(ir_official.tickers()))")
          fi
          echo "TICKERS=$TICKERS" >> "$GITHUB_ENV"
          echo "Tickers: $TICKERS"
      - name: Store listed files
        run: python -m etl.ir_backfill_runner --lane all --workers 5 --hours "$HOURS" --tickers "$TICKERS" --max-docs "$MAX_DOCS"
      - name: Second pass for files the hosts refused the first time
        run: python -m etl.ir_backfill_runner --lane all --workers 5 --hours "$HOURS" --tickers "$TICKERS" --max-docs "$MAX_DOCS"
      - name: Coverage against the listings
        run: python -m etl.ir_official report $(echo "$TICKERS" | tr ',' ' ')
      - name: Publish trend workbooks
        if: ${{ github.event.inputs.workbooks == 'true' }}
        run: |
          for t in $(echo "$TICKERS" | tr ',' ' '); do
            if [ -f "etl/ir_sources/workbooks/$t.xlsx" ]; then python -m etl.ir_workbook publish "$t"; fi
          done
