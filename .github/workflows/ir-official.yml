name: IR official sources
# Stores the files each company lists on its own investor-relations pages (etl/ir_sources/{TICKER}.json, built by
# etl/ir_official.py) with the fiscal period, type and release date the company states, corrects those fields on
# documents already stored, and republishes the document index with the listing and its coverage. Same collector as
# the backfill (etl/ir_backfill_runner.py -> ir.process_company), run for named tickers with a document budget large
# enough to take a whole listing in one pass. With "extended" on, everything else a company lists is stored too: its
# copies of 10-Q and 10-K filings and the filings it links on sec.gov, the web page of a release, offering and
# regulatory documents, XBRL archives and images. Call recordings and event pages are never stored.
#
# Every company gets its own runner. Reading a file's text is the slow part and it is CPU work, so companies that
# share one runner wait on each other: beside four others, one company stored 59 filings in two and a half hours,
# then its last 49 in two minutes once it was alone. Each runner makes two passes; the second retries files the
# host refused the first time.
#
# When the files are stored, the Docling workflow is started for the same companies ("docling" input), so their
# tables and reading order are parsed on parallel runners right away instead of waiting for the daily run.
#
# With "workbooks" on, trend workbooks (etl/ir_sources/workbooks/{TICKER}.xlsx) are then published: every figure is
# tied to a page line of a stored supplement and checked before it replaces the ticker's IR KPI set (the previous
# set is saved to raw/kpi_backups/ first). It runs after the documents are stored and refuses when fewer than 90% of
# the figures are found on a stored page.
# Needs repository secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FIRECRAWL_API_KEY, TAVILY_API_KEY, SEC_USER_AGENT.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (blank = every ticker with a source list)"
        required: false
        default: ""
      max_docs:
        description: "Documents per company in this run"
        required: false
        default: "2000"
      hours:
        description: "Hours per pass (two passes; max 2.7)"
        required: false
        default: "2.5"
      extended:
        description: "Store everything listed, not only earnings documents (filing copies, release pages, offering and regulatory documents, archives)"
        type: boolean
        required: false
        default: false
      workbooks:
        description: "Publish trend workbooks for these tickers after the documents are stored"
        type: boolean
        required: false
        default: false
      docling:
        description: "Parse the stored files with Docling on parallel runners when the download ends"
        type: boolean
        required: false
        default: true
permissions:
  contents: read
concurrency:
  group: ir-official
  cancel-in-progress: false
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
  TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
  SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
  TICKERS: ${{ github.event.inputs.tickers || '' }}
  MAX_DOCS: ${{ github.event.inputs.max_docs || '2000' }}
  HOURS: ${{ github.event.inputs.hours || '2.5' }}
  FU_IR_EXTENDED: ${{ github.event.inputs.extended == 'true' && '1' || '0' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.t.outputs.matrix }}
      list: ${{ steps.t.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: t
        name: Tickers
        run: |
          # The source lists need only the standard library. Tickers come from a form field, so they are checked
          # before they reach a shell or a matrix.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          from etl import ir_official
          asked = [t.strip().upper() for t in os.environ.get("TICKERS", "").split(",") if t.strip()]
          bad = [t for t in asked if not re.fullmatch(r"[A-Z0-9.\-]{1,10}", t)]
          if bad:
              raise SystemExit(f"Not a ticker: {bad}")
          tickers = list(dict.fromkeys(asked)) or ir_official.tickers()
          if not tickers:
              raise SystemExit("No ticker has a source list")
          print("matrix=" + json.dumps(tickers))
          print("list=" + ",".join(tickers))
          PY
      - run: echo "Tickers ${{ steps.t.outputs.list }}"
  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        ticker: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      TICKER: ${{ matrix.ticker }}
    steps:
      - name: Check secrets
        run: |
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SEC_USER_AGENT; do
            if [ -z "${!v}" ]; then echo "Missing repository secret $v"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Store listed files
        run: python -m etl.ir_backfill_runner --lane all --workers 1 --hours "$HOURS" --tickers "$TICKER" --max-docs "$MAX_DOCS"
      - name: Second pass for files the host refused the first time
        run: python -m etl.ir_backfill_runner --lane all --workers 1 --hours "$HOURS" --tickers "$TICKER" --max-docs "$MAX_DOCS"
      - name: Coverage against the listing
        run: python -m etl.ir_official report "$TICKER"
  finish:
    needs: [plan, collect]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      LIST: ${{ needs.plan.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Coverage against the listings
        run: python -m etl.ir_official report $(echo "$LIST" | tr ',' ' ')
      - name: Parse the stored files with Docling
        if: ${{ github.event.inputs.docling != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docling-backfill.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f tickers="$LIST" -f shards=20 -f limit=2000 -f hours=5
      - name: Publish trend workbooks
        if: ${{ github.event.inputs.workbooks == 'true' }}
        run: |
          pip install -r requirements.txt
          for t in $(echo "$LIST" | tr ',' ' '); do
            if [ -f "etl/ir_sources/workbooks/$t.xlsx" ]; then python -m etl.ir_workbook publish "$t"; fi
          done
