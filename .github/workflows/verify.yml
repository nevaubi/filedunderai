name: Verify research accuracy
on:
  pull_request:
  push:
    branches: [main, feat/research-workspace-accuracy]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm test
      - run: npm run test:financials
      - run: npm run test:parity
      - run: npm run build
